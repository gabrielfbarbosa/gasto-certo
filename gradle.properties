#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
# Kotlin/JS incremental compilation misses tests inherited from an abstract class (RepositoriesContract):
# the subclass is not recompiled when the contract gains a test, so jsTest runs fewer tests. Off for correctness.
kotlin.incremental.js.ir=false
