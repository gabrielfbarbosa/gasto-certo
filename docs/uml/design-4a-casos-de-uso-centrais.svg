o suspend [D4]. O RegisterExpenseViewModel</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="305.2" x="777.7601" y="1078.697">lista meios e terceiros pelo ManageRegistryUseCase (vista 5) e, se o</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="289.6499" x="777.7601" y="1090.627">m&#234;s estiver fechado [RN08], oferece reabrir (reopenAndConfirm).</text></g><?plantuml-src bLVDZXj54BxFKnGvZS5hE0G9MSQHvLsMI6jOxIfBK9H3kwTijzBJFVIFToqKYHCFW7W1n061n0bnuUetoPDGFNzUZsSSv-APxldgx-kghl97Gd7f4mIqJaWz43wLqKhG1XU6IopUCStS1b9CvsXiiJKQ6LoCn-sRrg51xJOPLliBpVN-1oUSHBXarkaf6gVXtK-_mZbQiLGGhuLr39wotX248fa5u-G5S6Qr1LBehGQEoXacBCHUmBkVVw5D903s8eaB1wJHYENAGI8CSYUqYgACyJTiYV34YoVmOmJ09RCMRd0fWcSN3nagYxVS82foUghJJ5isbpWUr-2fr1PdMhdLSTojJrDcDiT13Sjt0kzdEa6PEmVm2NXnwvX364B-_4hg-r53w4K16PSIk2PUB0cqOI_2nmgP6LoJmUUAk9Oo3M9nh_p6jLe8azPhEZLIC579jFoG1WR8Iix4zyXCGBvjOUcqc7Rue-7iO7kHICsITe_oM89G8v9ce84VxZ29Gr9jICj5UFQ1SUUPdAJQAqUxLrejd-r7MfxpQM6Mu4QC5YKPlqOZT19d-OEaYdNbvq98EiQljKpGnAlyKM2iLizsiIqCsbLSUFZsKRuNfT6Mz3Seqhat5aC2lB0u9LnLoBlZr2OKKKvA5wQPbZMCKiOPBIKQkW4gTl01kNSO2vNvm6mfzJmiUxlr7jMLXKSPU-qDNx7tMYjJlRPMYTNchaZnw97USOUR1u8jldGKmix5yZAid6ESX_GIQfdZMXAP5fDzKCEzaqNEu5wubVRkt6TIS4f26sEP-trIHpGGlcOaF_1nun12_JGYEdh49pgtCt69hYgKunRqeeEnFXoKI5rHfUfQnNU8R-AagDGhpPayf_SFKH0CnXlwoTF1dIQw7ssu3VRhxoYZd9bmGqmD9i9DQT67Lf9hlULz4BLtkhEpSMSdYWxwNK2tNE_HViCBgERL67MsknOFIYfEa-c-4TudtqpcgArp1UX1KdOY3qg-4_a1vjjku67UlIYnJ771qIXbeuD-rEvy9woHYkt0eyrZ29R9H0EZViIHfiE89h8bggGOo2WNH_FnxEvk5jgQz0yQl1Bvb4P36fEZJ-VZ8Gaxb8ncFOjgnS1k_m4DByl6IIhYyXL4wjtsjpNA7Ws81aExO_0o7myWnWKA6WIt_od1DVcbg27EwNeW1OgjSHbk2aqCafyc2C-9ozu09ji_jl-YXIyXtVxfT1A6JWqr1OCYX5s9GdnvCxczxXMkSvOm-BXYWsjj4bGCV9hFh-NuIYgGNeaO1ioIxQMX1wFFEjt-hOGUjBGEJ0CXZltWCVWmspbdm_GRz9FNTlkx1kjj5YX_TVxqzG2-xQvl09aFsoaAqe94k-4e3BrdA3NCc29A2-bTvfK3-kV4UP_65mZXfDk_RFutOas4B92Aa3XxTVFDPr-yhackE8QuEL3s1X6vM-J9_m00?></g></svg>