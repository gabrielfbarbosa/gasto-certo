stroke-width:1.1;"/></g><!--link SummaryViewModel to RegisterReimbursementUseCase--><g class="link" data-entity-1="ent0008" data-entity-2="ent0010" data-link-type="dependency" data-source-line="72" id="lnk28"><path codeLine="72" d="M477.71,670.137 C568.56,685.337 686.6822,705.1075 766.5822,718.4675" fill="none" id="SummaryViewModel-to-RegisterReimbursementUseCase" style="stroke:#4F5D75;stroke-width:1.1;"/><polygon fill="#4F5D75" points="772.5,719.457,764.2829,714.0275,767.5685,718.6324,762.9636,721.918,772.5,719.457" style="stroke:#4F5D75;stroke-width:1.1;"/><text fill="#4F5D75" font-family="Menlo" font-size="10" lengthAdjust="spacing" textLength="90.3076" x="536.33" y="674.8992">saldo a receber</text></g><g class="legend" data-source-line="74"><rect fill="#FFFFFF" height="110" rx="4" ry="4" style="stroke:#BFC0C0;stroke-width:1;" width="342.0099" x="698.5701" y="896.757"/><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="129.84" x="705.5701" y="913.797">MVVM + fluxo unidirecional</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="134.65" x="835.4101" y="913.837">: a tela desenha s&#243; o XUiState</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="263.55" x="705.5701" y="925.767">(UiState imut&#225;vel) e reage a XEvent (efeito &#250;nico: snackbar,</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="266.19" x="705.5701" y="937.697">navegar, oferecer reabrir). A&#231;&#245;es = m&#233;todos do ViewModel.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="91.28" x="705.5701" y="949.867">Controller (GRASP)</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="193.93" x="796.8501" y="949.907">: cada *UseCase coordena um caso de uso</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="299.1299" x="705.5701" y="961.837">e delega as regras ao dom&#237;nio. CloseMonthUseCase em destaque.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="328.0099" x="705.5701" y="973.767">M&#233;todos dos use cases s&#227;o suspend [D4]. O RegisterExpenseViewModel</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="305.2" x="705.5701" y="985.697">lista meios e terceiros pelo ManageRegistryUseCase (vista 5) e, se o</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="289.6499" x="705.5701" y="997.627">m&#234;s estiver fechado [RN08], oferece reabrir (reopenAndConfirm).</text></g><?plantuml-src bLRDZYCr4BxtKnHxwi1CuB18Q1GQZJB3iD86HZFQOT5g3uwxEh7MRJV-oKo4LkB40o1U07508752NBZcJVP9AFVlfDF9Xajts_rLrUVFLNPz81INFaL0wuJKO-5p6Iq5JN1XkCJg6_F2hI77V8x6LbEJYS4iIOOdhKE3sgqBREOppVNs3oUSHBXYrkaf6gVXtO-_m0LQiL0GhuHr39woqHa8HJOPuyG2EBFQ0ZdqLWD7vGmJ5c8luDrFFzCa4W17aSJC0NaqOh5qa0g3t0cjegXW_0rR83pnuWdy405moQo56ro8mEpoeK1byPORH4Mafpelj6LpYKdIWgTIMvnfvPQ7SRS-pvbP7mRr8jy9l9_f56L93k0ZyEBMCOTm1kNxIwdl9psZ5nKagIrmHRfOCXZ2NeQV3R8mkAA0pnHfBMKUpE9H_OzhbGcJjsFQDN9mhj9f_ICF2b2KKedla9c0V3kWqd5hwl07bzF1jbOYDKk76PLh2KQzbSJRTElDEevh3UuHjIWfpQxH29t6HVaYgshSnCw4fBtuIiiKJRmiNnN6QlL5Hp0pQ9SrmxUFahRAxw7ClK6Hpxsn67RnXSKfuPfgt9Ti7Opsr1aj9HegqMRb-83SEuo5AhmZbhNLip0STUCj6Pi8ZrBgsXk-PE-DLkTY6wqnQyCz9yUJHtwJFJHt30UuxCdKZc9zMlMbsCqm6fnphhroGYtAwTBa5Ew5MshlBdmX1QSiiJ6INjnXUaBkQ2s4RvTrIOAiavwI8Kjxj0xkqv7akX1Nw9fCFXn1PwNnReGJsCdXDkLhrwsBRn7Vn6bLIiyrP_A2ll-FWn0mNjEZt5DtdEdsQaEvRXV8GKKvCw64fmPJuQOqE851aLk_TS56m_V9wMcozxoFTcwLW1uuHAFjQoMW-cTNjFTI6M1GIt6SpVwoVfzzFvcZeViXG7UISYzofsxt8WV2xvptmx7tmdgPD0myU3YVWMKorS3elET8BLH4RSi2LLfrBPHAataokxkRXMj3-WSDNecobQ5EXid9n_FaZ8mTIaODaKMrP60tVuE6b_N5H2xY-XD4xjtcrnNA4NLH1iDrmk1bUOT2Z1aA