<text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="263.55" x="604.5701" y="849.767">(UiState imut&#225;vel) e reage a XEvent (efeito &#250;nico: snackbar,</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="266.19" x="604.5701" y="861.697">navegar, oferecer reabrir). A&#231;&#245;es = m&#233;todos do ViewModel.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="91.28" x="604.5701" y="873.867">Controller (GRASP)</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="193.93" x="695.8501" y="873.907">: cada *UseCase coordena um caso de uso</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="299.1299" x="604.5701" y="885.837">e delega as regras ao dom&#237;nio. CloseMonthUseCase em destaque.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="328.0099" x="604.5701" y="897.767">M&#233;todos dos use cases s&#227;o suspend [D4]. O RegisterExpenseViewModel</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="305.2" x="604.5701" y="909.697">lista meios e terceiros pelo ManageRegistryUseCase (vista 5) e, se o</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="289.6499" x="604.5701" y="921.627">m&#234;s estiver fechado [RN08], oferece reabrir (reopenAndConfirm).</text></g><?plantuml-src ZLRDZkD44BxxAOezEJ0JE2mI6WMZKMOOLjeiendji6YrXqwxdBIstMtw9pCHMeaJ3u1u0SG1WSG9SU7gDzadeTfsd8bZPtE9--Uhlw-hAlMHK5pw506j4rAFXSzbj1Hqm8NX4kirveLRGuxv78sjZoOJWrcIz1zQXmQrMnUuESyqrxiNJZY9SCMiqrCqJiFxdtw52xHYeI1U2UiOF6MZCn2AP3B6oGlWp6eBfD1R3HoLCqnOYBs0zp__GeT801n54ZC7fD68nT91AWno9xIAeeBnjso1yCIB9_1Z1C0binPkS262PvSF1IgBjzmWAd9wglD2MpQNc2GjU2grnPbMRdaOT