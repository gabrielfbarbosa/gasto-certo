!--link RegistryRepository to RecurrenceRepository--><g class="legend" data-source-line="84"><rect fill="#FFFFFF" height="121.65" rx="4" ry="4" style="stroke:#BFC0C0;stroke-width:1;" width="337.9398" x="2128.8462" y="844.097"/><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="298.5699" x="2135.8462" y="860.897">Todos os m&#233;todos s&#227;o suspend; Flow s&#243; onde a tela observa [D4].</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="323.9398" x="2135.8462" y="872.827">RoomTransaction usa useWriterConnection { immediateTransaction { } }:</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="201.74" x="2135.8462" y="884.757">tudo ou nada no fechamento do m&#234;s (UC03).</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="309.3199" x="2135.8462" y="896.687">Room: 8 tabelas com chaves estrangeiras (pessoa, institui&#231;&#227;o e meio</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="321.1899" x="2135.8462" y="908.617">s&#227;o salvos antes do que aponta para eles); enums gravados pelo nome.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="180.98" x="2135.8462" y="920.787">Low Coupling + Dependency Injection</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="127.07" x="2316.8262" y="920.827">: os use cases conhecem s&#243;</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="314.5199" x="2135.8462" y="932.757">as interfaces; o Koin injeta Room no mobile e mem&#243;ria na Web/testes.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="304.4899" x="2135.8462" y="944.687">Room*Repository e InMemory*Repository: uma classe por interface,</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="298.5999" x="2135.8462" y="956.617">com o mesmo nome (ex.: RoomEntryRepository); setas resumidas.</text></g><?plantuml-src dLVDRjj64BxpAQO-aOcj56W25BAXmh7JmaY468a3emXoM94ZQHDobzrTAX5I0ts8la4FHNFDeVVwJVea_POKgQL4jqW1sI9dlfcT_nrz9LMQLnaJMoTpFP9LaKTB2K8gJPfpyyn5wTPKS35ZOnlIoOdX-MGoJBIE3MktBhcbptMg-mpBZYoNmWYd3IcjE7BIvKm_2Elq6HkdwUzVVgLpjdAXA5v9wmGzd2LZCbngAztjPoErFQGIvuDv-qcbKX2JL6_vzlVRtpJ5cIw4LAEDW3Ph-kjFoWGK-M-PH54fqdTYmNIm1psWZn516KoUYvJfYN9c_MAhoNE9xfCLAuxPCsdSW9A0SvhdDLEo1ViPx3ofCPCMb77ExWu5Swcon-kBB9OPM2-XHIsI5lJT1gJdKwtSCYxyVp3hjnzPcAH_O0U_PCGjYn5Eupn4fo8_5uuFYLKM4kvISBMK9hk4z3fstIEmK6orsafzA5bPzd8tlKYUfgckb8CpjQq3CVMEFpTdXc75i6CxEi9SY3vh7vpiMVI25x1uCBqbwpBdkFEgSR8DXbJe6rSvgPNTOYwsr1OeKYTNV2dM1J8zPRVKMI3Geqy2PvhJuhB-seOuG0HdnO4rm0QSKA1tLbo6R_w0yBrVe_z3S2diawRu_mCFmcEjSnPg83TfPGohb0UoquIrWI2zZsMU1s7jqIV38XSgrGKF2JMSRQPNc97UP7ijtV9CUxzcJTo3nBUWJSc5kUnP4y_m3s8zOZA4Rin0RlrNAD4mXefP5hFAMFPst3MmJ0YgjGRloPUsUazwl-6lZ53MnnrrsTq5hJdy0GwXpMUvJjz1eQriwGSHedeqeIj_nbMjyIOOrdw4no-qBkZfzD8Fyq8Ze3p524-QmPtcmbewBKjCCZ4Jrjz2Ng1zdKmwq86dtmiY5J-24c79qsjo1_MKm9kjYlFJvnREeDgbyxF-Far5wTksLdGke6F7_X6kplemP14ZRi_qWmirhH53be7JDwm53ndNybhNUvP8Yf_gdQDX-LHd5Qx_bbBcmisrAJRacsXZuxrNbi-WiZPgyspRFI2AEieeq-_LQB9tYOwfic8V5XPC0-bCwZ2Tq9XGP5vRrBUoGtPfzDM5nW4hFbMPqJ9x89-_JEwIQuCSY5tpB8cs-aPLEVfvo2jPuDBmpO0oHMGUDKAXMnlHC5_TUL-WTY3l_whw23srLmz3IeQ0FjGQUnbZ1SFwK1aHnC8Br7M-wwbd17qOXJtP2UtwUlGQcsF6wetFnT6stk_U7NOajhqxSBbtM2CNItSqUCT4KSuBFuXg33hXIcTm4v_YzWzNFrk_P6xcrJ5zd-lt87qchR3p2dAS2z8posObwFNvmpSZADaD3ceRVtnj98ObBXN53VqZSbrm9h40XV2FT4CtO-XnLQP9LwH49h0zqvpJfV2LeGcCulQJfVZLsTVV9EsXO_gM47JOP0aJXm37NUNtVgXVi3IWOy-mLel3TgsHpHhDsFAbXfx6Nv6luBl0TBV-h9ygE5jgNvD-coVi2ZOvnYvP5POMHgo43rN9kOQT1NjxJcQJPuZLcQxA79d4i3nd7qCaO8sYUzl4uEJ1R3BsyKPyAArRFTLgoIaNFipG0vExIyOUaoO_oUhz7yRKjmCYqzmCjHE5_yc0S0b27p-0_VYqyGcdBDF0xCKSAaGp3fbA