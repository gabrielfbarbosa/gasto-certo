size="10" lengthAdjust="spacing" textLength="298.5699" x="1883.5802" y="815.617">Todos os m&#233;todos s&#227;o suspend; Flow s&#243; onde a tela observa [D4].</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="318.3799" x="1883.5802" y="827.547">RoomTransacao usa useWriterConnection { immediateTransaction { } }:</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="201.74" x="1883.5802" y="839.477">tudo ou nada no fechamento do m&#234;s (UC03).</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" font-weight="bold" lengthAdjust="spacing" textLength="180.98" x="1883.5802" y="851.647">Low Coupling + Dependency Injection</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="127.07" x="2064.5602" y="851.687">: os use cases conhecem s&#243;</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="314.5199" x="1883.5802" y="863.617">as interfaces; o Koin injeta Room no mobile e mem&#243;ria na Web/testes.</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="313.5699" x="1883.5802" y="875.547">Room*Repository e *EmMemoriaRepository: uma classe por interface,</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="331.0299" x="1883.5802" y="887.477">com o mesmo nome (ex.: RoomLancamentoRepository); setas resumidas.</text></g><?plantuml-src bLR1Rjms4BthAwO-QLDxNQ39PMCiuEucHP0OCLm7EGGvSAMnpLJa22Jbn70Dz2Fw1pqKpJM7tki_wPVqKLfffLqvQ84OqGuVPzuCPnxvZRPPKULCx8CkPAehKoHN6ePCkwpWvfjD6Mx8i5cnyutfwCZnnNm-RlI17KkuARcrNqWcmmNFWJoNogaWZgnOJe8E1TEFoWTPi0j2__pw6otPwqjBwRNsGT7ZrMH6ZalnEjn_SLhyFfM8ZyNxppRJYfYq_S3tVzp_BfJcOfIsq_K60Px-_ejo1K_nVpr9ab9bFwjBfhrTx1xT9WHt87sXCgPNocRAi0rore9kQWZHj-HLSQrSMj2iXviC5iyb5zyWmFTe0vktEFw4qz0FUSdbX7rgs6CLNyTM9YE-El0f8uTS