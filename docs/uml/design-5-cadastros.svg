"spacing" textLength="264.67" x="1365.4001" y="1869.737">ManageRegistryUseCase s&#243; exclui meio sem lan&#231;amentos;</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="272.0699" x="1365.4001" y="1881.667">com lan&#231;amentos, s&#243; desativa [RN09]. CorrectEntryUseCase</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="257.71" x="1365.4001" y="1893.597">respeita m&#234;s fechado [RN08]. Reembolso &#8804; saldo [RN03].</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="296.9699" x="1365.4001" y="1905.527">SeedDemoDataUseCase carrega a demo na 1&#170; execu&#231;&#227;o s&#243; pelos</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="266.5299" x="1365.4001" y="1917.457">use cases (tamb&#233;m registra gastos e compras parceladas e</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="257.27" x="1365.4001" y="1929.387">fecha o m&#234;s anterior, gerando os previstos do m&#234;s atual);</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="227.45" x="1365.4001" y="1941.317">&#233; idempotente: n&#227;o faz nada se j&#225; houver pessoas.</text></g><?plantuml-src dLTHRoCr47xVNp7SKo9w4UW0GQcAhks1AbrfbGeaXEx1sPqa1gzdPNjB0wh4A-_y0GJIwUwLVq3-2R-4iJTxyJRUJSjBq_LyC_DvPZnZloTrhke20QsJYYQoBbMsbBoGIvChRFx7id8hAB6SeR7Dqj6HmVdnSNhHEZH8RbLXkpwddBe29vr2-4fOHwTe7C6_l_uEPsZbGiFeHbeduEFn8UIYO8WX2mW5ba9QNhByoMPhIvd2kGFMDdAnT518WxcJfBEi4lcFOe7mf9PFu9SC85V2MfZYWcsRrRSIVxgW0bKaoMjZKETeTuNd-eOZLA9s2U4BxOoCjUuYxnQPByOKBeHcKKla6ukd3E0OdHBR8QNGSAGy7E1zg90gXQCn7C9BnXzTSR197s-aKdFQNErtRBUOy-rg2nGSbHky4Yk_XGjqIoeYXSvwgs85AmHleohyCBhv7aU8oDSeOiFOI18hT7oDglZBEuY_MxK20ttX_f-omaShtkqawrrjxCcNtsA3bdfn8fKQpVWF--WiZbFeSvrJYHn5_nDhD88KhwWiz_52TwM4rbW4iPmrAHDvJhLs8LsjgUV