ext fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="272.0699" x="1365.4001" y="1874.387">com lan&#231;amentos, s&#243; desativa [RN09]. CorrectEntryUseCase</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="257.71" x="1365.4001" y="1886.317">respeita m&#234;s fechado [RN08]. Reembolso &#8804; saldo [RN03].</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="296.9699" x="1365.4001" y="1898.247">SeedDemoDataUseCase carrega a demo na 1&#170; execu&#231;&#227;o s&#243; pelos</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="266.5299" x="1365.4001" y="1910.177">use cases (tamb&#233;m registra gastos e compras parceladas e</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="257.27" x="1365.4001" y="1922.107">fecha o m&#234;s anterior, gerando os previstos do m&#234;s atual);</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="227.45" x="1365.4001" y="1934.037">&#233; idempotente: n&#227;o faz nada se j&#225; houver pessoas.</text></g><?plantuml-src dLVDRYD54BxFKnHxieNN0YqW257G9bbGf0qREO8BsaDxfcmtz7IDkdj238h4bJilW41QxLvv0_mcF0dLFHxS4_UC4ovnfkkh_-gghlUapbLT8A1rKj5KrgNALf8FScboXSt_M5Pk3IMMSpIsEJe-DhWuEKaVMeS6oQqhRCyNb5ENuAHJ25y9w-WCZIFuvvVVu1ojN6eOtKZh17myFe9S50mnP06Xm598oqUMFrbiRIbJk730t4OkLmuAQJ1tadIMLIB_GImHdjJo2VoS0UHAM0ipNB9ii_vMue-NLA2AA7bj3EeSxJxnGjzmX4hKBa5yePsHCTTTfDqYsukn2PT2Cwarv1kBPmpW69qHoo6bq72aF1pWVQYGAeMZCHp1IyOVNt6mIPzigL9psbpjFROxpCNkj0KAZieDNecrT-4ItOgAYA5pth9OmGn1swWAFunkliSH8j8rYgnXR4I96JgwHbNyvHN4torRWS5yuVuViy97Czxj9Uk_sZYGB-zYWvPwUIgL6itv3-le78vJw0kTKuaSHVyJSpI4b5rHMHwo2zsL4bfZ4SXotgHCv3dLseLqjQAUDsSJ4EMMTaaQrr-CKwYjU1Eg6Ssru69zXD0959nMNuUK2tNE_pTQlCCTVsTR1Qyqlbei6i01b_6M0-ZOd0CQ-GHjRcIrBTnhvuFUOySP6TzY_9K_T7Mna6w47iYY0aEt9jEq