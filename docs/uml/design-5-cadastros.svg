&#231;&#227;o s&#243; pelos</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="266.5299" x="1660.3801" y="1923.187">use cases (tamb&#233;m registra gastos e compras parceladas e</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="257.27" x="1660.3801" y="1935.117">fecha o m&#234;s anterior, gerando os previstos do m&#234;s atual);</text><text fill="#4F5D75" font-family="'Helvetica Neue'" font-size="10" lengthAdjust="spacing" textLength="227.45" x="1660.3801" y="1947.047">&#233; idempotente: n&#227;o faz nada se j&#225; houver pessoas.</text></g><?plantuml-src fLZTRXmr5BwVfp2zsXNf2bH04AAjcgH5bH8I9O10g1TUpzbTWySUsPuqMnI9M-vv0GHIrTuYNe1zapu9n_REpioEPoPRRZ8xzdV-Zp-Vp0TSCb6aGC1OBjI45vb8bXmN6DTCGFWDMMvN98Di1jg4fQCZ3VFfDBveB6XGTfL3kJvNJ3KtBBS2o5VKM7K2sYhoxjVVoIaOlf1aTCEDfUJJyI5XD4M8LeO0II6ZtE2ImLTKMnYL29XRWjAQBvQMf5m3irp99Caf-vakW3me-0FoIq884zGOSWKBrArNtt5uUQvI47wFa0z9mQyjjK0EYNy-4-hbKOd-DknDDr2u0MaD8XkWfswrXD0qlSIyA3aQLolF9MRP5ix1-l8bNMKeUWvsgTBjHWeKGxb1iwEy3a2p3O4AB-0-sBjQBbYXDKW6vhxfs0eCP6IBsqtACHUYcHAcCeW4xO4p_8DAWpuk5swn3TteuFvHXuUDPj3FvGtskaj996W3zb9GAI4zKT9gFWkreeofGbfKNKa_2Mi7X6QRlJCb5uzBxxHl2j3NLC2-yfMpJvqJiUe8HTDHXZukKV3SFNy0gdUDxoGNKcv7Q5glKCYfNkrQFy2i6gPvxiBsfNTfBEMPadEkiwUtEHuoI5kgc2seU19DnwOv6nAxpSYpMQ4DkEIq0ov36WMfkzhvDe2C0FL3VaubRcqFhu4J120B-Q8g8K0Z5vMQSr0vrcZiN4RyKJYsPSlowiYQ2bCxoDlUTiq8ZTDM4sYiboA6ea0WYTm_t77rFyOrH9qqQjxuPjg-rGMQT79FxYZFqdi9kzhkANZNAbP5BVtrqdKogAMuGHBJNN0u2Z5usAdNfA6fbuCQwBreA4HT8wE1gFyNCo51mEhnE8PwVxhoIf4mmYLnfXWLf_WxM741xnplOE12miLy7W038SCj9X19OyXY1sd5_JXHseq8de26x0VolPX7YBRi8gzdsiclG_ItFwlw78pBxMYA6qmwV9W0p_rCm375zc8miakkSIBHTbMnKMZc9d2dI16n-_LAmzj6FDS0wIba2f6q36EtDmITWN1pXmEU-HUdz5Wf0LJkNXMfmW6o72yDUOGpvIUpSMmyl89S6MuLLc8pr4QcfXwGhqxF_kOuOP_wdkerLylFaCLds2trpRjaq_L26V2Mgdu8YAGz43zyE8tVe4bqOAp3TpbyMA9vHH_Y_nDScIGwf5LYRTfCMfEIG_UGJbmWmWv9ns1IrnyxSKCnj4DdpZYMZvea3gbCrdihwRn00xxThVqIzKQw1xAbDdAdzJhUWTzBUSJd3cJdmUiFjLkixs9hkNOly